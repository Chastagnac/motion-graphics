</style></head><body class="bd"><script>/* motion-kit engine: one shape that never cuts.
   Every style is a pure function of time inside seek(t). No CSS transitions, no timers. */
(function(){
const M = window.M = {};
const clamp = M.clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
M.lerp = (a,b,u)=>a+(b-a)*u;
const eo = M.eo = x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio = M.eio = x=>{x=clamp(x);return x*x*x*(x*(6*x-15)+10)};

// closed-form spring step response 0 -> 1 (zero initial velocity)
const S = M.S = (tau,w,z)=>{
  if(tau<=0) return 0;
  if(!isFinite(w)) return 1;
  if(z<1){const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*tau)*(Math.cos(wd*tau)+z*w/wd*Math.sin(wd*tau));}
  return 1-Math.exp(-w*tau)*(1+w*tau);
};
M.MORPH=[15,0.84]; M.FAST=[27,0.86]; M.SLOW=[12.5,0.9]; M.SOFT=[10,0.95]; M.CAM=[7.5,1]; M.INSTANT=[Infinity,1];

// a value that changes target many times = the sum of one spring per change.
// period>0 and a closed loop adds the previous cycle's residue so t=period == t=0.
M.track = (v0,keys,def=M.MORPH,period=0)=>{
  let prev=v0; const ks=[];
  for(const k of keys){const d=k[1]-prev; prev=k[1]; const sp=k[2]||def; if(d!==0) ks.push([k[0],d,sp[0],sp[1]]);}
  const loop = period>0 && Math.abs(prev-v0)<1e-9;
  return t=>{let v=v0; for(const k of ks){v+=k[1]*S(t-k[0],k[2],k[3]); if(loop) v+=k[1]*(S(t+period-k[0],k[2],k[3])-1);} return v;};
};
const hex = M.hex = h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
M.ctrack = (h0,keys,def=[20,1],period=0)=>{
  const c0=hex(h0); const tr=[0,1,2].map(i=>M.track(c0[i],keys.map(k=>[k[0],hex(k[1])[i],k[2]]),def,period));
  return t=>`rgb(${tr.map(f=>Math.round(clamp(f(t),0,255))).join(',')})`;
};
// step helper: pick the latest value whose time has passed
M.step = (v0,keys)=>t=>{let v=v0; for(const k of keys) if(t>=k[0]) v=k[1]; return v;};

// content swap: exit blurs out fast; enter waits, then blurs in (own timings -> no overlap)

  const din=o.din??0.07, lin=o.lin??0.26, lout=o.lout??0.12, bl=o.blur??12;
  const a = tin==null?1:eo((t-tin-din)/lin);
  const b = tout==null?0:eo((t-tout)/lout);
  return {o:a*(1-b), blur:(1-a)*bl+b*bl*0.8, s:(0.94+0.06*a)*(1-0.03*b), a, b};
};
M.apply = (el,v,extra='')=>{
  if(v.o<0.002){el.style.display='none';return false;}
  el.style.display=''; el.style.opacity=v.o.toFixed(4);
  el.style.filter=v.blur>0.05?`blur(${v.blur.toFixed(2)}px)`:'none';
  el.style.transform=`scale(${v.s.toFixed(4)})${extra}`;
  return true;
};

// cursor path: keyframes [t,x,y] in world coords, eased between keys with a slight human arc
M.path = (CK)=>t=>{
  if(t<=CK[0][0]) return {x:CK[0][1],y:CK[0][2]};
  const L=CK[CK.length-1]; if(t>=L[0]) return {x:L[1],y:L[2]};
  let i=0; while(t>=CK[i+1][0]) i++;
  const [t0,x0,y0]=CK[i],[t1,x1,y1]=CK[i+1];
  const u=eio((t-t0)/(t1-t0)), dx=x1-x0, dy=y1-y0, arc=Math.sin(Math.PI*u)*0.06;
  return {x:x0+dx*u-dy*arc, y:y0+dy*u+dx*arc};
};

  for(const [a,b] of drags){k.push([a-0.04,1,[45,1]],[b,0,[22,0.72]]);}
  k.sort((a,b)=>a[0]-b[0]); return M.track(0,k);
};

M.crossTimes = (f,t0,t1,ths)=>ths.map(th=>{for(let t=t0;t<=t1;t+=0.001) if(f(t)>=th) return t; return Infinity;});

/* scene runner
 cfg = { W,H, center:[x,y], bg:'#hex'|null(alpha), SH:{name:{w,h,r,bg,cam}}, start:'name', SEQ:[[t,'name'],...],

         intro:t|null, geom(t,g) -> g, extra(t,g), T }                                                              */
M.scene = (cfg)=>{
  const $=id=>document.getElementById(id);
  const {W,H}=cfg; const [CX,CY]=cfg.center||[W/2,H/2];
  const stage=$('stage'), world=$('world'), shape=$('shape'), cur=$('cursor');
  stage.style.width=W+'px'; stage.style.height=H+'px'; $('wrap').style.width=W+'px'; $('wrap').style.height=H+'px';
  stage.style.background=cfg.bg||'transparent';
  if(!cfg.bg) document.documentElement.classList.add('alpha');
  const P0=cfg.SH[cfg.start], SEQ=cfg.SEQ;
  const sp=cfg.spring||M.MORPH;
  const tr=k=>M.track(P0[k],SEQ.map(([t,n])=>[t,cfg.SH[n][k]]),sp);
  const shW=tr('w'), shH=tr('h'), shR=tr('r');
  const shBG=M.ctrack(P0.bg,SEQ.map(([t,n])=>[t,cfg.SH[n].bg]),[20,1]);
  const cam=M.track(P0.cam,SEQ.map(([t,n])=>[t,cfg.SH[n].cam]),cfg.camSpring||M.CAM);
  const press=M.track(0,(cfg.shapePress||[]).flatMap(c=>[[c-0.07,1,[45,1]],[c+0.035,0,[22,.72]]]));
  const intro=cfg.intro===undefined?0.02:cfg.intro;
  const cpath=cfg.cursor?M.path(cfg.cursor.keys):null, cpress=cfg.cursor?M.presses(cfg.cursor.clicks,cfg.cursor.drags):null;
  if(cfg.cursor) cur.style.width=(cfg.cursor.size||46)+'px'; else cur.style.display='none';
  const layers=(cfg.layers||[]).map(L=>({...L,node:$(L.el)}));
  const seek=(t)=>{
    let g={t, w:shW(t), h:shH(t), r:shR(t), bg:shBG(t), s:cam(t), cx:0, cy:0, fx:0, fy:0, sc:1-0.035*press(t), op:1};
    if(intro!=null){const a=S(t-intro,13,0.78); g.sc*=0.55+0.45*a; g.op=clamp((t-intro)/0.12);}
    g.cursor=cpath?cpath(t):null;
    if(cfg.geom) g=cfg.geom(t,g)||g;
    g.r=Math.min(g.r,g.h/2,g.w/2);
    world.style.transform=`translate(${(CX-g.s*g.fx).toFixed(3)}px,${(CY-g.s*g.fy).toFixed(3)}px) scale(${g.s.toFixed(5)})`;
    const st=shape.style;
    st.left=(g.cx-g.w/2).toFixed(3)+'px'; st.top=(g.cy-g.h/2).toFixed(3)+'px';
    st.width=g.w.toFixed(3)+'px'; st.height=g.h.toFixed(3)+'px'; st.borderRadius=g.r.toFixed(3)+'px';
    st.background=g.bg; st.transform=`scale(${g.sc.toFixed(5)})`; st.opacity=g.op.toFixed(4);
    for(const L of layers){
      const v=M.vis(t,L.tin,L.tout,L.o||{});
      if(M.apply(L.node,v)){
        const an=L.anchor||'c';
        L.node.style.left=(an==='l'?0:g.w/2).toFixed(3)+'px';
        L.node.style.top=(an==='t'?0:g.h/2).toFixed(3)+'px';
        if(L.update) L.update(t,g,v);
      }
    }
    if(cfg.extra) cfg.extra(t,g);
    if(cpath){
      const c=g.cursor, sx=CX+g.s*(c.x-g.fx), sy=CY+g.s*(c.y-g.fy);
      cur.style.transform=`translate(${(sx-3).toFixed(2)}px,${(sy-3).toFixed(2)}px) scale(${(1-0.13*cpress(t)).toFixed(4)})`;
    }
  };
  window.seek=seek; window.DURATION=cfg.T;
  // preview mode: loop in the browser, scaled to fit
  const RENDER=location.search.includes('render');
  document.body.classList.add(RENDER?'render':'preview');
  seek(0);
  if(!RENDER){
    const fit=()=>{const k=Math.min(innerWidth/W,(innerHeight-30)/H);const wr=$('wrap');wr.style.transform=`translate(-50%,-50%) scale(${k})`;};
    fit(); addEventListener('resize',fit);
    const t0=performance.now();
    const loop=()=>{seek(((performance.now()-t0)/1000)%(cfg.T+0.8));requestAnimationFrame(loop);};
    requestAnimationFrame(loop);
  }
  return seek;
};

    pointe: { d: [[0, 0], [-30, 4], [-56, 0]], main: [-56, 0] },
    croise: { d: [[0, 0], [-12, 22], [24, 24]], main: [24, 24] },
    tient: { d: [[0, 0], [-22, 24], [-34, 10]], main: [-34, 10] },
    haussement: { d: [[0, 0], [-18, 16], [-36, 2]], main: [-36, 2] }
  };

  /* ---------- 4. OBJETS TENUS ---------- */
  const PROPS = {
    cafe: (x, y) => `<rect x="${x - 9}" y="${y - 20}" width="18" height="21" rx="3" fill="${COLORS.cafe}" stroke-width="4"/>` +
      `<path d="M${x} ${y - 26} C${x - 4} ${y - 30} ${x + 4} ${y - 34} ${x} ${y - 39}" stroke-width="3"/>`,
    telephone: (x, y) => `<rect x="${x - 7}" y="${y - 30}" width="14" height="32" rx="7" fill="${COLORS.bleu}" stroke-width="4"/>`,
    bloc: (x, y) => `<rect x="${x - 13}" y="${y - 30}" width="26" height="32" rx="2" fill="${COLORS.blanc}" stroke-width="4"/>` +
      `<path d="M${x - 7} ${y - 20} L${x + 7} ${y - 20} M${x - 7} ${y - 12} L${x + 7} ${y - 12} M${x - 7} ${y - 4} L${x + 3} ${y - 4}" stroke-width="2.5"/>`,
    postit: (x, y) => `<rect x="${x - 12}" y="${y - 24}" width="24" height="24" fill="${COLORS.postit}" stroke-width="3.5" transform="rotate(-8 ${x} ${y - 12})"/>`,
    aspiration: (x, y) => `<path d="M${x} ${y} C${x + 4} ${y - 20} ${x + 16} ${y - 24} ${x + 14} ${y - 42}" stroke-width="7"/>` +
      `<circle cx="${x + 14}" cy="${y - 46}" r="4" fill="${COLORS.blanc}" stroke-width="3"/>`,
    miroir: (x, y) => `<path d="M${x} ${y} L${x + 2} ${y - 30}" stroke-width="4"/>` +
      `<circle cx="${x + 3}" cy="${y - 38}" r="8" fill="${COLORS.masque}" stroke-width="3.5"/>`,
    sonde: (x, y) => `<path d="M${x} ${y} L${x + 2} ${y - 32} C${x + 2} ${y - 40} ${x + 10} ${y - 40} ${x + 9} ${y - 34}" stroke-width="3.5"/>`
  };

  /* ---------- 5. JAMBES ---------- */
  const JAMBES = {
    debout: (h, c) => `M${h[0]} ${h[1]} L${h[0] + c * 4} ${SOL} L${h[0] + c * 16} ${SOL}`,
    marche: (h, c) => `M${h[0]} ${h[1]} L${h[0] + c * 16} ${SOL} L${h[0] + c * 28} ${SOL}`,
    tremble: (h, c) => {
      const t = (SOL - h[1]) / 3;
      return `M${h[0]} ${h[1]} L${h[0] + c * 6} ${h[1] + t} L${h[0] - c * 3} ${h[1] + 2 * t} L${h[0] + c * 4} ${SOL} L${h[0] + c * 14} ${SOL}`;
    }
  };

  /* ---------- 6. EFFETS ---------- */
  function gouttes(b) {
    const { x, y, s, k } = b.visage;
    const dx = s + 26 * k;
    return `<ellipse cx="${x + dx + 8}" cy="${y - 4}" rx="3.5" ry="7" fill="${COLORS.goutte}" stroke-width="2.5"/>` +
      `<ellipse cx="${x - dx - 8}" cy="${y + 2}" rx="3.5" ry="7" fill="${COLORS.goutte}" stroke-width="2.5"/>`;
  }
  const EFFETS = {
    sueur: (b) => (b.id === 'lait' ? '' : gouttes(b)),
    choc: (b) => {
      const t = b.haut;
      return `<path d="M68 ${t - 2} L58 ${t - 14} M100 ${t - 8} L100 ${t - 24} M132 ${t - 2} L142 ${t - 14}" stroke-width="4"/>`;
    },
    zzz: (b) => {
      const t = b.haut, z = (x, y, s) => `M${x} ${y} L${x + s} ${y} L${x} ${y + s} L${x + s} ${y + s}`;
      return `<path d="${z(140, t - 4, 10)} ${z(154, t - 20, 13)} ${z(170, t - 40, 16)}" stroke-width="3.5"/>`;
    }
  };

  /* ---------- 7. FINITIONS ---------- */
  // Mains et chaussures sont des marqueurs SVG posés au bout des traits : les tracés des bras et des
  // jambes ne changent pas, et la main ou le pied suit le trait quand une animation le déplace.
  const marqueur = (nom, inner) => `<marker id="${nom}" markerUnits="userSpaceOnUse" markerWidth="60" markerHeight="40" refX="30" refY="20" viewBox="0 0 60 40" overflow="visible">${inner}</marker>`;
  const finitions = (humain, u) => `<defs>` +
    marqueur('dc-main-' + u, `<circle cx="30" cy="20" r="5.4" fill="${COLORS.blanc}" stroke="${INK}" stroke-width="3.6"/>`) +
    [['G', 13, 35], ['D', 25, 47]].map(([c, x0, x1]) => marqueur('dc-pied-' + u + c,
      `<path d="M${x0} 21 A11 9 0 0 1 ${x1} 21 Z" fill="${humain ? COLORS.blanc : INK}" stroke="${INK}" stroke-width="3.6" stroke-linejoin="round"/>`)).join('') +
    `</defs>`;

  /* ---------- 8. ASSEMBLAGE ---------- */
  // Chaque dessin porte ses propres marqueurs et masques, sous un numéro à lui : une page qui montre et
  // cache des cases ne peut pas faire dépendre un personnage visible d'une définition cachée.
  let numero = 0;
  const pts = (arr) => 'M' + arr.map((p) => p.join(' ')).join(' L');

  function renderTooth(pose, opts) {
    opts = opts || {};
    const id = pose.dent;
    const base = BODIES[id];
    if (!base) throw new Error('Dent inconnue : ' + id);
    const b = Object.assign({ id }, base);
    const p = Object.assign({ jambes: 'debout' }, base.defaut, pose);
    const ex = EXPRESSIONS[p.expression] || {};
    const sourcils = p.sourcils || ex.sourcils || 'neutre';
    const yeux = p.yeux || ex.yeux || 'points';
    const bouche = p.bouche || ex.bouche || 'neutre';
    const effets = [].concat(ex.effets || [], p.effets || []);
    const sig = SIGNATURES[id] || {};
    const { x, y, s, k } = b.visage;
    const u = ++numero, humain = b.type === 'humain', pied = 'dc-pied-' + u;
    let o = finitions(humain, u);

    // jambes
    o += `<path d="${JAMBES[p.jambes](b.hanches[0], -1)}" marker-end="url(#${pied}G)"/><path d="${JAMBES[p.jambes](b.hanches[1], 1)}" marker-end="url(#${pied}D)"/>`;
    // corps : une dent a un croissant d'ombre à droite, sous son contour
    o += b.dessin ? b.dessin(u) : `<defs><clipPath id="dc-corps-${u}"><path d="${b.path}" transform="translate(7 4)"/></clipPath></defs>` +
      `<path d="${b.path}" fill="${COLORS.ombre}" stroke="none"/>` +
      `<path d="${b.path}" fill="${COLORS.blanc}" stroke="none" transform="translate(-7 -4)" clip-path="url(#dc-corps-${u})"/>` +
      `<path d="${b.path}"/>`;
    if (sig.apresCorps) o += sig.apresCorps(b);
    // bras et objets
    const props = [];
    [['brasG', 'propG', 0, 1], ['brasD', 'propD', 1, -1]].forEach(([bk, pk, i, m]) => {
      const a = BRAS[p[bk]];
      if (!a) return;
      const [ex0, ey0] = b.epaules[i];
      const abs = a.d.map(([ax, ay]) => [ex0 + ax * m, ey0 + ay]);
      o += `<path d="${pts(abs)}" marker-end="url(#dc-main-${u})"/>`;
      if (p[pk] && PROPS[p[pk]]) props.push(PROPS[p[pk]](ex0 + a.main[0] * m, ey0 + a.main[1]));
    });
    // visage : deux joues roses, puis l'accessoire, puis les traits
    o += [-1, 1].map((c) => `<circle cx="${x + c * (s + 8 * k)}" cy="${y + 13 * k}" r="${5.5 * k}" fill="${COLORS.joue}" stroke="none" opacity="0.6"/>`).join('');
    if (sig.avantVisage) o += sig.avantVisage(b);
    const by = -14 * k, my = 24 * k;
    o += `<g stroke-width="${5 * k}">`;
    o += `<path transform="translate(${x - s} ${y + by}) scale(${k})" d="${SOURCILS[sourcils][0]}"/>`;
    o += `<path transform="translate(${x + s} ${y + by}) scale(${k})" d="${SOURCILS[sourcils][1]}"/>`;
    o += `<g transform="translate(${x - s} ${y}) scale(${k})">${YEUX[yeux]()}</g>`;
    o += `<g transform="translate(${x + s} ${y}) scale(${k})">${YEUX[yeux]()}</g>`;
    const masque = p.masque || null;
    if (masque !== 'haut') o += BOUCHES[bouche] === 'ELLIPSE'
      ? `<ellipse cx="${x}" cy="${y + my}" rx="${6 * k}" ry="${8 * k}" fill="${INK}"/>`
      : `<path transform="translate(${x} ${y + my}) scale(${k})" d="${BOUCHES[bouche]}"/>`;
    o += `</g>`;
    if (masque === 'haut') {
      o += `<path d="M67 76 L80 80 M133 76 L120 80" stroke-width="3"/>` +
        `<rect x="79" y="77" width="42" height="24" rx="9" fill="${COLORS.masque}" stroke-width="4"/>` +
        `<path d="M85 85 L115 85 M85 92 L115 92" stroke-width="2"/>`;
    } else if (masque === 'menton') {
      o += `<path d="M70 92 L82 100 M130 92 L118 100" stroke-width="3"/>` +
        `<rect x="81" y="97" width="38" height="15" rx="7" fill="${COLORS.masque}" stroke-width="4"/>`;
    }
    o += props.join('');
    if (sig.apresTout) o += sig.apresTout(b);
    effets.forEach((e) => { if (EFFETS[e]) o += EFFETS[e](b); });

    const w = opts.width ? ` width="${opts.width}"` : '';
    const h = opts.height ? ` height="${opts.height}"` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"${w}${h} role="img" aria-label="${b.nom}">` +
      `<g fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">${o}</g></svg>`;
  }

  const API = {
    renderTooth, renderCharacter: renderTooth, BODIES, EXPRESSIONS, SOURCILS, YEUX, BOUCHES, BRAS, PROPS, JAMBES, EFFETS, COLORS,
    catalogue: () => ({
      dents: Object.keys(BODIES).filter((k) => BODIES[k].type === 'dent'),
      humains: Object.keys(BODIES).filter((k) => BODIES[k].type === 'humain'),
      masques: ['haut', 'menton'], expressions: Object.keys(EXPRESSIONS), sourcils: Object.keys(SOURCILS),
      yeux: Object.keys(YEUX), bouches: Object.keys(BOUCHES), bras: Object.keys(BRAS),
      objets: Object.keys(PROPS), jambes: Object.keys(JAMBES), effets: Object.keys(EFFETS)
    })
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.Dents = API;
})(typeof window !== 'undefined' ? window : globalThis);
</script><script>/*
 * Les Dents du Cabinet : décors. Aucune dépendance, Node et navigateur, comme dents.js.
 *
 * Un décor est un fond ton sur ton : des aplats sans contour, dans des nuances de la couleur de
 * la série, pour que le trait noir des personnages reste seul au premier plan.
 * Decors.rendre(nom, { W, H, sol, u, fond }) renvoie une chaîne SVG de W x H.
 *   sol  : y de la jonction entre le mur et le sol
 *   u    : pixels par unité de personnage (un dentiste mesure 232 unités), les meubles suivent
 *   fond : couleur de la série, en #RRGGBB
 *   pieds, piedY : facultatifs, x des personnages et y de leurs pieds, pour poser une ombre au sol
 */
(function (root) {
  const ENCRE = '#141413', BLANC = '#FFFFFF';
  const rvb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mel = (a, b, k) => '#' + rvb(a).map((v, i) => Math.round(v + (rvb(b)[i] - v) * k).toString(16).padStart(2, '0')).join('');
  const tons = (fond) => ({
    fond, sol: mel(fond, ENCRE, 0.13), meuble: mel(fond, ENCRE, 0.2), ombre: mel(fond, ENCRE, 0.31), fonce: mel(fond, ENCRE, 0.44),
    pale: mel(fond, BLANC, 0.2), clair: mel(fond, BLANC, 0.5), lumiere: mel(fond, BLANC, 0.82), ligne: mel(fond, ENCRE, 0.19)
  });
  const n = (v) => +v.toFixed(1);
  const DENT = 'M-10 -8C-10 -18 -2 -18 0 -13C2 -18 10 -18 10 -8C10 0 8 4 7 12C6.5 16 3.5 16 3 11C2.5 7 -2.5 7 -3 11C-3.5 16 -6.5 16 -7 12C-8 4 -10 0 -10 -8Z';

  /* Petits outils de dessin : tout est exprimé en unités u au-dessus du sol. */
  function outils(o) {
    const { W, H, sol, u } = o;
    const y = (h) => sol - h * u;                                     // hauteur h au-dessus de la jonction mur/sol
    const R = (x, h, l, ep, c, r, rot) => `<rect x="${n(x)}" y="${n(y(h))}" width="${n(l)}" height="${n(ep * u)}" rx="${n((r || 0) * u)}" fill="${c}"${rot ? ` transform="rotate(${rot[0]} ${n(rot[1])} ${n(y(rot[2]))})"` : ''}/>`;
    const P = (pts, c) => `<path d="M${pts.map(([x, h]) => n(x) + ' ' + n(y(h))).join(' L')} Z" fill="${c}"/>`;
    const C = (x, h, r, c) => `<circle cx="${n(x)}" cy="${n(y(h))}" r="${n(r * u)}" fill="${c}"/>`;
    const E = (x, h, rx, ry, c, a) => `<ellipse cx="${n(x)}" cy="${n(y(h))}" rx="${n(rx * u)}" ry="${n(ry * u)}" fill="${c}"${a ? ` transform="rotate(${a} ${n(x)} ${n(y(h))})"` : ''}/>`;
    const T = (x, h, s, c) => `<path transform="translate(${n(x)} ${n(y(h))}) scale(${+(s * u).toFixed(2)})" d="${DENT}" fill="${c}"/>`;   // silhouette de dent
    return { W, H, u, y, R, P, C, E, T };
  }
  /* La pièce : haut de mur plus clair au-dessus d'une cimaise, plinthe, sol avec ses lignes de fuite.
     carreaux : true pour un carrelage (lignes dans les deux sens), sinon un parquet. */
  const piece = (o, t, carreaux) => {
    const { W, H, sol, u } = o, c = W / 2, yc = sol - 244 * u, ep = n(Math.max(1, 0.9 * u));
    const fuites = Array.from({ length: 15 }, (_, i) => i - 7).map((i) =>
      `<path d="M${n(c + i * 0.085 * W)} ${n(sol)} L${n(c + i * 0.15 * W)} ${H}" stroke="${t.ligne}" stroke-width="${ep}" fill="none"/>`).join('');
    const travers = carreaux ? [0.3, 0.68].map((k) => `<rect x="0" y="${n(sol + (H - sol) * k)}" width="${W}" height="${ep}" fill="${t.ligne}"/>`).join('') : '';
    return (yc > 0 ? `<rect x="0" y="0" width="${W}" height="${n(yc)}" fill="${t.pale}"/><rect x="0" y="${n(yc)}" width="${W}" height="${n(2.5 * u)}" fill="${t.meuble}"/>` : '') +
      `<rect x="0" y="${n(sol)}" width="${W}" height="${n(H - sol)}" fill="${t.sol}"/>` + fuites + travers +
      `<rect x="0" y="${n(sol - 6 * u)}" width="${W}" height="${n(6 * u)}" fill="${t.meuble}"/>`;
  };
  /* Fenêtre : cadre, vitre, croisillons, store et appui. x est son centre. */
  const fenetre = ({ u, R }, t, x, vitre) =>
    R(x - 30 * u, 216, 60 * u, 92, t.clair, 3) + R(x - 26 * u, 212, 52 * u, 84, vitre, 2) +
    R(x - 1 * u, 212, 2 * u, 84, t.clair) + R(x - 26 * u, 171, 52 * u, 2, t.clair) + R(x - 34 * u, 124, 68 * u, 4, t.ombre, 1);
  /* Ombre au sol sous chaque personnage : elle l'ancre dans la pièce. */
  const ombres = (o, t) => (o.pieds || []).map((x) =>
    `<ellipse cx="${n(x)}" cy="${n(o.piedY)}" rx="${n(44 * o.u)}" ry="${n(6.5 * o.u)}" fill="${t.ombre}"/>`).join('');

  const DECORS = {
    aucun: { nom: 'Aucun', dessin: () => '' },
    sol: { nom: 'Mur et sol', dessin: (o, t) => piece(o, t) },

    /* Salle de soins : fenêtre et meuble bas à gauche, fauteuil et scialytique au centre, négatoscope à droite. */
    cabinet: {
      nom: 'La salle de soins',
      dessin: (o, t) => {
        const k = outils(o), { W, u, R, P, C, E, T } = k;
        const m = 0.3 * W;                                             // largeur du meuble bas
        const f = 0.55 * W;                                            // pied du fauteuil
        const v = 0.15 * W, x = 0.87 * W;                              // fenêtre, négatoscope
        return piece(o, t, true) +
          // fenêtre, son store, et la lumière qu'elle jette sur le sol
          fenetre(k, t, v, t.lumiere) + R(v - 26 * u, 212, 52 * u, 13, t.pale) +
          P([[v - 22 * u, -5], [v + 30 * u, -5], [v + 62 * u, -40], [v + 2 * u, -40]], t.fond) +
          // faisceau du scialytique sur le fauteuil
          P([[f - 36 * u, 176], [f + 6 * u, 184], [f + 52 * u, 58], [f - 74 * u, 58]], t.pale) +
          // négatoscope : boîte lumineuse et radio d'une dent
          R(x - 27 * u, 206, 54 * u, 46, t.ombre, 3) + R(x - 23 * u, 202, 46 * u, 38, t.lumiere, 2) + T(x, 184, 0.95, t.clair) +
          // meuble bas, plan de travail, portes, poignées, robinet
          R(0, 82, m, 82, t.meuble) + R(0, 90, m + 6 * u, 8, t.ombre, 2) +
          R(m * 0.33, 70, 2.5 * u, 58, t.ombre) + R(m * 0.66, 70, 2.5 * u, 58, t.ombre) +
          R(m * 0.14, 66, 9 * u, 2.5, t.clair, 1) + R(m * 0.47, 66, 9 * u, 2.5, t.clair, 1) + R(m * 0.8, 66, 9 * u, 2.5, t.clair, 1) +
          R(m * 0.5, 112, 4 * u, 22, t.ombre, 2) + R(m * 0.5, 112, 20 * u, 4, t.ombre, 2) +
          // sur le plan de travail : boîte de gants, flacon, gobelet
          R(m * 0.08, 104, 22 * u, 14, t.clair, 2) + R(m * 0.08 + 7 * u, 106, 8 * u, 3, t.lumiere, 1) +
          R(m * 0.82, 110, 8 * u, 20, t.clair, 3) + R(m * 0.82 + 2 * u, 115, 4 * u, 6, t.ombre, 1) +
          // scialytique : colonne, bras, tête lumineuse
          R(f + 66 * u, 196, 5 * u, 196, t.meuble) + R(f - 6 * u, 196, 77 * u, 5, t.meuble, 2) +
          R(f - 34 * u, 190, 44 * u, 15, t.lumiere, 7, [-12, f - 12 * u, 183]) +
          // tablette porte-instruments
          R(f - 96 * u, 98, 5 * u, 98, t.meuble) + R(f - 118 * u, 104, 50 * u, 6, t.ombre, 2) +
          R(f - 110 * u, 110, 3 * u, 6, t.clair, 1) + R(f - 102 * u, 112, 3 * u, 8, t.clair, 1) + R(f - 86 * u, 109, 10 * u, 5, t.clair, 2) +
          // fauteuil : socle, colonne, repose-jambes, assise, dossier, têtière
          R(f - 30 * u, 8, 60 * u, 8, t.ombre, 3) + R(f - 8 * u, 40, 16 * u, 34, t.ombre) +
          R(f - 78 * u, 54, 44 * u, 12, t.clair, 6, [28, f - 34 * u, 48]) +
          R(f - 40 * u, 54, 62 * u, 14, t.clair, 6) +
          R(f + 14 * u, 56, 78 * u, 14, t.clair, 7, [-58, f + 18 * u, 49]) +
          C(f + 62 * u, 126, 11, t.clair) +
          P([[f - 30 * u, 40], [f + 30 * u, 40], [f + 24 * u, 34], [f - 24 * u, 34]], t.ombre);
      }
    },

    /* Accueil : cadre, plante et chaises d'attente à gauche, banque, écran et étagère de dossiers à droite. */
    accueil: {
      nom: "L'accueil",
      dessin: (o, t) => {
        const { W, u, R, P, C } = outils(o);
        const b = 0.44 * W, p = 0.085 * W, h = 0.3 * W, s = 0.19 * W;
        const chaise = (x) => R(x + 3 * u, 40, 3 * u, 40, t.ombre) + R(x + 22 * u, 40, 3 * u, 40, t.ombre) +
          R(x + 2 * u, 86, 24 * u, 32, t.clair, 5) + R(x, 47, 28 * u, 8, t.clair, 3);
        const dossiers = [[0, 26, 'meuble'], [8, 30, 'clair'], [16, 24, 'ombre'], [24, 30, 'meuble'], [32, 27, 'clair'], [44, 30, 'ombre'], [52, 22, 'meuble'], [64, 28, 'clair'], [72, 30, 'meuble'], [80, 25, 'ombre']];
        return piece(o, t) +
          // tapis de la salle d'attente
          R(0.05 * W, -9, 0.36 * W, 15, t.meuble, 7) +
          // cadre au mur, avec une dent dedans
          R(p - 20 * u, 196, 46 * u, 56, t.ombre, 2) + R(p - 15 * u, 191, 36 * u, 46, t.lumiere, 1) +
          outils(o).T(p + 3 * u, 167, 0.85, t.clair) +
          // horloge
          C(h, 198, 16, t.ombre) + C(h, 198, 12.5, t.lumiere) + R(h - 1 * u, 207, 2 * u, 10, t.ombre, 1) + R(h, 199, 8 * u, 2, t.ombre, 1) +
          // chaises d'attente
          chaise(s) + chaise(s + 33 * u) +
          // plante
          P([[p - 13 * u, 30], [p + 13 * u, 30], [p + 9 * u, 0], [p - 9 * u, 0]], t.ombre) +
          [[-16, 62, -28], [0, 76, 0], [16, 64, 26], [-9, 92, -12], [10, 96, 14]].map(([dx, hh, a]) =>
            `<ellipse cx="${n(p + dx * u)}" cy="${n(o.sol - hh * u)}" rx="${n(9 * u)}" ry="${n(24 * u)}" fill="${t.meuble}" transform="rotate(${a} ${n(p + dx * u)} ${n(o.sol - hh * u)})"/>`).join('') +
          // étagère de dossiers au-dessus de la banque
          R(b + 16 * u, 178, 96 * u, 4, t.ombre, 1) +
          dossiers.map(([dx, hh, c]) => R(b + 20 * u + dx * u, 178 + hh, 7 * u, hh, t[c], 1)).join('') +
          // banque d'accueil, plateau, panneau clair, présentoir

50,"marge":28,"gouttiere":18,"bord":7,"pied":40};</script><script>/*
 * dents-strip : scène. Branche la bibliothèque Dents sur le moteur motion.js.
 * Même contrat que le moteur : chaque style est une fonction pure du temps dans seek(t),
 * la page expose window.seek et window.DURATION, « ?render » coupe l'aperçu en boucle.
 * Le dessin vient uniquement de Dents.renderTooth : ici on trie ses calques, on ne redessine rien.
 */
(function () {
  const M = window.M, D = window.Dents;
  const SOL = 248;                                   // pieds dans le repère 200 x 260 de la bibliothèque
  // cadrage du reel 1080 x 1920. Une planche de BD passe le sien à monter().
  const REEL = {
    SOL_Y: 1530,                                     // pieds à l'écran, au-dessus de la zone basse des reels
    sol: 1455,                                       // jonction du mur et du sol, pour le décor
    CADRE: { 1: { s: 4.0, x: [0.5] }, 2: { s: 3.1, x: [0.29, 0.71] }, 3: { s: 2.7, x: [0.18, 0.5, 0.82] } },
    TEXTE: { haut: 190, hauteur: 340, ecart: 110, marge: 80, max: 150, min: 64 },                 // narration
    BULLE: { haut: 140, marge: 56, padX: 52, padY: 34, rayon: 54, queue: 30, ecart: 96, hauteur: 320, largeurMin: 240, max: 150 }

  const n2 = (v) => +v.toFixed(2);

  const saut = (t0, amp) => M.track(0, [[t0, -amp, [60, 1]], [t0 + 0.07, 0, [20, 0.5]]]);

  function monter(stage, DATA, cadrage) {

        return g[0];

        const calques = valeurs.map((v) => {
          const g = document.createElementNS(SVG, 'g');

      });

        const pas = M.step(0, c.fx[nom]);
        majs.push((u) => { g.style.display = pas(u) ? '' : 'none'; });
      });

      // --- conteneur : c'est lui seul qui se déplace (entrée, sursaut), jamais le corps ---
      const el = document.createElement('div');
      el.className = 'perso';
      el.style.width = 200 * s + 'px'; el.style.height = 260 * s + 'px';
      el.style.left = cx - 100 * s + 'px'; el.style.top = SOL_Y - SOL * s + 'px';
      el.appendChild(svg);
      const horsChamp = H - (SOL_Y - SOL * s) + 40;
      const sauts = c.sursauts.map((t) => saut(t, 30));
      if (c.entree === 'saut') sauts.push(saut(0, 20));
      majs.push((u) => {
        let y = c.entree === 'ressort' ? (1 - M.S(u - c.retard, R_ENTREE[0], R_ENTREE[1])) * horsChamp : 0;
        sauts.forEach((f) => { y += f(u); });
        el.style.transform = `translateY(${y.toFixed(2)}px)`;
      });
      return { el, cx, tete: SOL_Y - (SOL - corps.haut) * s, maj: (u) => majs.forEach((f) => f(u)) };
    }

    // --- une case = un plan : les personnages, puis le bloc de texte (bulle si quelqu'un parle, cartouche sinon) ---
    const cases = DATA.cases.map((c) => {
      const el = document.createElement('div');
      el.className = 'case';
      const cadre = CADRE[c.places];

      if (window.Decors && c.decor && c.decor !== 'aucun') el.insertAdjacentHTML('afterbegin', window.Decors.rendre(c.decor, {
        W, H, sol: C.sol, u: cadre.s, fond: DATA.fond, pieds: TEXTE.cartouche ? c.persos.map((p) => W * cadre.x[p.place]) : [], piedY: SOL_Y

        const o = personnage(p, W * cadre.x[p.place], cadre.s);
        el.appendChild(o.el);
        return o;
      });

        ombre.setAttribute('class', 'ombre'); ombre.setAttribute('transform', 'translate(11 13)');
        trace = document.createElementNS(SVG, 'path');
        svg.append(ombre, trace); bloc.appendChild(svg);
        if (c.voix == null) bloc.classList.add('recit');
      }

      txt.className = 'txt';
      const mots = c.texte.map((w, i) => {
        const sp = document.createElement('span');
        sp.className = 'mot'; sp.textContent = w.m;
        if (i) txt.appendChild(document.createTextNode(' '));
        txt.appendChild(sp);
        return { sp, t: w.t };
      });
      bloc.appendChild(txt); el.appendChild(bloc); stage.appendChild(el);
      return { c, el, bloc, txt, mots, persos, trace };
    });

    // taille du texte : la plus grande qui tient, mesurée avec la vraie police ; la bulle épouse le texte
    let calibre = false;
    const ajuster = (txt, mots, hMax, max) => {
      let f = max;
      for (; f > TEXTE.min; f -= 2) {
        txt.style.fontSize = f + 'px';
        if (txt.offsetHeight <= hMax && mots.every((m) => m.sp.offsetWidth <= txt.clientWidth)) break;
      }
      txt.style.fontSize = f + 'px';
    };
    const emprise = (mots) => ({
      xs: Math.min(...mots.map((m) => m.sp.offsetLeft)), xe: Math.max(...mots.map((m) => m.sp.offsetLeft + m.sp.offsetWidth)),
      ys: Math.min(...mots.map((m) => m.sp.offsetTop)), ye: Math.max(...mots.map((m) => m.sp.offsetTop + m.sp.offsetHeight))
    });
    const calibrer = () => {
      const pret = document.fonts.check('900 100px Geist');
      cases.forEach(({ c, el, bloc, txt, mots, persos, trace }) => {
        if (!mots.length) return;
        const vu = el.style.display; el.style.display = '';
        const sommet = Math.min(...persos.map((p) => p.tete));
        if (c.voix == null) {
          // narration : en haut, mais jamais loin des têtes quand les personnages sont petits
          const haut = Math.max(TEXTE.haut, sommet - TEXTE.ecart - TEXTE.hauteur);
          const h = Math.min(TEXTE.hauteur, sommet - 40 - haut);
          const lt = Math.min(W - 2 * TEXTE.marge, TEXTE.largeur || W), gt = (W - lt) / 2;
          txt.style.left = gt + 'px'; txt.style.top = '0px'; txt.style.width = lt + 'px';
          ajuster(txt, mots, h, TEXTE.max);
          if (!trace) txt.style.top = haut + (h - txt.offsetHeight) / 2 + 'px';
          else {                                       // cartouche de BD : boîte au cordeau, collée en haut
            const { xs, xe, ys, ye } = emprise(mots), r = TEXTE.rayon;
            const x0 = n2(gt + xs - TEXTE.padX), x1 = n2(gt + xe + TEXTE.padX), y0 = haut, y1 = n2(haut + ye - ys + 2 * TEXTE.padY);
            txt.style.top = y0 + TEXTE.padY - ys + 'px';
            trace.setAttribute('d', `M${x0 + r} ${y0} H${x1 - r} A${r} ${r} 0 0 1 ${x1} ${y0 + r} V${y1 - r} A${r} ${r} 0 0 1 ${x1 - r} ${y1}` +
              ` H${x0 + r} A${r} ${r} 0 0 1 ${x0} ${y1 - r} V${y0 + r} A${r} ${r} 0 0 1 ${x0 + r} ${y0} Z`);
            bloc.style.transformOrigin = `${(x0 + x1) / 2}px ${(y0 + y1) / 2}px`;
            bloc.style.transform = 'rotate(-1.4deg)';                  // cartouche posé un peu de travers, comme une étiquette
          }
        } else {
          const qui = persos[c.voix], bas = sommet - BULLE.ecart;
          txt.style.left = txt.style.top = '0px'; txt.style.width = Math.min(W - 2 * (BULLE.marge + BULLE.padX), BULLE.largeur || W) + 'px';
          ajuster(txt, mots, Math.min(BULLE.hauteur, bas - BULLE.haut - 2 * BULLE.padY), BULLE.max);
          const { xs, xe, ys, ye } = emprise(mots);
          const l = Math.max(BULLE.largeurMin, xe - xs + 2 * BULLE.padX), h = ye - ys + 2 * BULLE.padY;
          const cx = M.clamp(M.lerp(W / 2, qui.cx, 0.5), BULLE.marge + l / 2, W - BULLE.marge - l / 2);
          const x0 = n2(cx - l / 2), x1 = n2(cx + l / 2), y1 = n2(bas), y0 = n2(bas - h), r = Math.min(BULLE.rayon, h / 2);
          txt.style.left = cx - (xs + xe) / 2 + 'px'; txt.style.top = y0 + BULLE.padY - ys + 'px';
          const q = BULLE.queue, tx = n2(M.clamp(M.lerp(cx, qui.cx, 0.8), x0 + r + q, x1 - r - q)), px = n2(qui.cx), py = n2(qui.tete - 24);
          trace.setAttribute('d', `M${x0 + r} ${y0} H${x1 - r} A${r} ${r} 0 0 1 ${x1} ${y0 + r} V${y1 - r} A${r} ${r} 0 0 1 ${x1 - r} ${y1}` +
            ` H${tx + q} Q${n2(tx + q * 0.35)} ${n2(y1 + (py - y1) * 0.6)} ${px} ${py} Q${n2(tx - q * 0.75)} ${n2(y1 + (py - y1) * 0.45)} ${tx - q} ${y1} H${x0 + r} A${r} ${r} 0 0 1 ${x0} ${y1 - r} V${y0 + r} A${r} ${r} 0 0 1 ${x0 + r} ${y0} Z`);
          bloc.style.transformOrigin = `${px}px ${py}px`;
        }
        if (trace) trace.previousSibling.setAttribute('d', trace.getAttribute('d') || '');
        el.style.display = vu;
      });
      calibre = pret;
    };
    document.fonts.load('900 100px Geist').then(calibrer);

    return (t) => {
      if (!calibre) calibrer();
      t = M.clamp(t, 0, DATA.T - 1e-4);
      cases.forEach(({ c, el, bloc, mots, persos }) => {
        const u = t - c.t0;
        if (u < 0 || u >= c.duree) { el.style.display = 'none'; return; }
        el.style.display = '';
        if (c.voix != null) {
          bloc.style.visibility = u < c.tBulle ? 'hidden' : '';
          bloc.style.transform = `scale(${(0.6 + 0.4 * M.S(u - c.tBulle, R_BULLE[0], R_BULLE[1])).toFixed(4)})`;
        }
        mots.forEach(({ sp, t: tm }) => {
          if (u < tm) { sp.style.visibility = 'hidden'; return; }
          const a = M.S(u - tm, R_MOT[0], R_MOT[1]);
          sp.style.visibility = '';
          sp.style.transform = `translateY(${((1 - a) * 0.22).toFixed(4)}em) scale(${(0.86 + 0.14 * a).toFixed(4)})`;
        });
        persos.forEach((p) => p.maj(u));
      });
    };
  }
  window.DentsScene = monter;

  // --- page d'un strip animé : même contrat que les clips du moteur ---
  const stage = document.getElementById('stage'), DATA = window.STRIP;
  if (!stage || !DATA) return;
  const wrap = document.getElementById('wrap');
  wrap.style.width = DATA.W + 'px'; wrap.style.height = DATA.H + 'px';
  const seek = monter(stage, DATA);
  window.seek = seek; window.DURATION = DATA.T;

  const RENDER = location.search.includes('render');
  document.body.classList.add(RENDER ? 'render' : 'preview');
  seek(0);
  if (!RENDER) {
    const fit = () => { const k = Math.min(innerWidth / DATA.W, innerHeight / DATA.H); wrap.style.transform = `translate(-50%,-50%) scale(${k})`; };
    fit(); addEventListener('resize', fit);
    const t0 = performance.now();
    const loop = () => { seek(((performance.now() - t0) / 1000) % (DATA.T + 0.6)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script><script>/*
 * dents-strip : images fixes. Chaque case du strip est montée par la même scène que la vidéo,
 * figée sur sa dernière image (pose finale, réplique entière), puis rangée dans sa page :
 * la planche (toutes les cases) et les pages du carrousel (1 à 4 cases chacune).
 */
(function () {
  const P = window.PLANCHE, DATA = window.STRIP;
  const figes = [];
  const carrousel = P.pages.filter((p) => p.id !== 'planche').length;

  P.pages.forEach((p) => {
    const page = document.createElement('div');
    page.className = 'planche'; page.id = 'page-' + p.id;
    page.style.width = P.W + 'px'; page.style.height = P.H + 'px';
    p.cellules.forEach((cel) => {
      const c = DATA.cases[cel.index];
      const v = document.createElement('div');
      v.className = 'vignette';
      Object.assign(v.style, { left: cel.x + 'px', top: cel.y + 'px', width: cel.l + 'px', height: cel.h + 'px' });
      const scene = document.createElement('div');
      v.appendChild(scene); page.appendChild(v);
      const seek = window.DentsScene(scene, DATA, cel.cadrage);
      scene.style.transform = `scale(${cel.cadrage.echelle})`;
      figes.push(() => seek(c.t0 + c.duree - 0.02));
    });
    const pied = document.createElement('div');
    pied.className = 'pied';
    Object.assign(pied.style, { left: P.marge + 'px', right: P.marge + 'px', top: P.piedY + 'px', height: P.pied + 'px' });
    const gauche = document.createElement('span'), droite = document.createElement('span');
    gauche.textContent = DATA.titre + (p.id !== 'planche' && carrousel > 1 ? `  ${p.id.slice(1)}/${carrousel}` : '');
    droite.textContent = P.signature;
    pied.append(gauche, droite); page.appendChild(pied);
    document.body.appendChild(page);
  });

  const figer = () => figes.forEach((f) => f());
  figer();
  window.pret = document.fonts.load('900 100px Geist').then(() => document.fonts.ready).then(() => { figer(); return true; });
})();
</script></body></html>
