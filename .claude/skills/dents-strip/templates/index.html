<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tous les strips</title>
<style>
:root{--encre:#141413;--papier:#F6F4EF;--gris:#6B6860}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--encre);font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;padding:14px 24px;background:#fff;border-bottom:3px solid var(--encre)}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.meta{font-size:14px;color:var(--gris)}
.etat{margin-left:auto;font-size:14px;font-weight:700}
main{max-width:1600px;margin:0 auto;padding:24px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;align-items:start}
.carte{background:#fff;border:3px solid var(--encre);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
video{display:block;width:100%;aspect-ratio:9/16;cursor:pointer}
.carte>a img{display:block;width:100%;height:auto}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-bottom:3px solid var(--encre)}
.pages a{flex:0 0 100%;scroll-snap-align:start}
.pages img{display:block;width:100%;height:auto;aspect-ratio:4/5}
.fleches{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 0;font-size:13px;font-weight:700;color:var(--gris)}
.fleches button{font:inherit;font-weight:800;padding:4px 12px;border:2px solid var(--encre);border-radius:8px;background:#fff;cursor:pointer}
.fleches button:disabled{opacity:.3;cursor:default}
.corps{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
h2{margin:0;font-size:17px;font-weight:800;line-height:1.25}
.num{font-size:13px;font-weight:700;color:var(--gris)}
label{font-size:13px;font-weight:700}
textarea{width:100%;min-height:84px;resize:vertical;padding:10px;border:2px solid var(--encre);border-radius:8px;font:inherit;background:var(--papier)}
textarea:focus{outline:3px solid #B9C8FF;background:#fff}
a{color:inherit;font-weight:700;font-size:14px}
.filtres{display:flex;flex-wrap:wrap;gap:8px}
.filtres button,.pub button{font:inherit;font-size:13px;font-weight:800;padding:5px 14px;border:2px solid var(--encre);border-radius:999px;background:#fff;color:var(--encre);cursor:pointer}
.filtres button[aria-pressed="true"]{background:var(--encre);color:#fff}
.pub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.pastille{padding:3px 12px;border:2px solid var(--encre);border-radius:999px;font-size:12px;font-weight:800;background:#FFD84D}
.carte.publie .pastille{background:#2BA58A;color:#fff}
.carte.publie>.pages,.carte.publie>a,.carte.publie>video{opacity:.55}
.carte[hidden]{display:none}
.detail{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px 16px}
@media (max-width:600px){main{padding:16px}}
/* visionneuse : l'image entière à l'écran, sans rien autour, prête à capturer ou à télécharger */
.visio{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#141413}
.visio.ouverte{display:flex}
.visio .zone{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
.visio img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;background:#fff}
.visio .barre{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:10px 14px 14px;color:#fff;font-size:15px;font-weight:700}
.visio .barre span{min-width:150px;text-align:center}
.visio button,.visio .barre a{font:inherit;font-size:15px;font-weight:800;padding:8px 16px;border:2px solid #fff;border-radius:999px;background:transparent;color:#fff;cursor:pointer;text-decoration:none}
.visio .principal{background:#fff;color:#141413}
.visio button:disabled{opacity:.3;cursor:default}
img.agrandir{cursor:zoom-in}
</style>
</head>
<body>
<header>
  <h1>Les Dents du Cabinet</h1>
  <span class="meta" id="meta"></span>
  <nav class="filtres" id="filtres" aria-label="Filtrer les strips"></nav>
  <span class="etat" id="etat" role="status"></span>
</header>
<main><section class="grille" id="grille"></section></main>
<script>
const S = __DONNEES__;
const $ = (id) => document.getElementById(id);
$('meta').textContent = `${S.length} strips · fais défiler les pages d'un carrousel avec les flèches, clique sur une image pour la voir en grand et la télécharger`;
const etat = (t) => { $('etat').textContent = t; };
const api = (id) => '/api/commentaires/' + encodeURIComponent(id);
// visionneuse : clic sur une image -> elle s'affiche entière, flèches pour feuilleter, boutons pour enregistrer les images en pleine taille
const visio = (() => {
  const mk = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const TACTILE = matchMedia('(pointer: coarse)').matches;
  const boite = mk('div', 'visio'), zone = mk('div', 'zone'), img = mk('img'), barre = mk('div', 'barre');
  const avant = mk('button', null, '←'), apres = mk('button', null, '→'), ou = mk('span'), dl = mk('button', 'principal', TACTILE ? 'Enregistrer l’image' : 'Télécharger l’image'), tout = mk('button', null, TACTILE ? 'Tout enregistrer' : 'Tout télécharger'), fermer = mk('button', null, 'Fermer');
  avant.setAttribute('aria-label', 'Image précédente'); apres.setAttribute('aria-label', 'Image suivante');
  boite.setAttribute('role', 'dialog'); boite.setAttribute('aria-label', 'Image en grand');
  zone.appendChild(img); barre.append(avant, ou, apres, dl, tout, fermer); boite.append(zone, barre);
  document.body.appendChild(boite);
  let images = [], i = 0;
  const nom = (src) => decodeURIComponent(src.split('?')[0].split('/').pop());
  // les images sont chargées dès l'ouverture : au clic, le fichier est déjà prêt et le navigateur accepte de l'enregistrer
  const prets = new Map();
  const charger = (src) => {
    if (!prets.has(src)) prets.set(src, fetch(src).then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then((b) => { if (!b.type.startsWith('image/')) throw new Error('pas une image'); return new File([b], nom(src), { type: b.type }); })
      .catch((e) => { prets.delete(src); throw e; }));
    return prets.get(src);
  };
  // téléphone : feuille de partage (Enregistrer dans Photos, Instagram). Ordinateur : un fichier PNG par image.
  const enregistrer = async (srcs) => {
    let fichiers;
    try { fichiers = await Promise.all(srcs.map(charger)); } catch (e) { ou.textContent = 'Image introuvable, recharge la page'; return; }
    if (TACTILE && navigator.canShare && navigator.canShare({ files: fichiers })) {
      try { await navigator.share({ files: fichiers }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    fichiers.forEach((f, k) => setTimeout(() => {
      const a = mk('a'); a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    }, k * 350));
  };
  const montrer = () => {
    img.src = images[i]; img.alt = nom(images[i]);
    ou.textContent = images.length > 1 ? `Image ${i + 1} sur ${images.length}` : nom(images[i]);
    images.forEach((src) => charger(src).catch(() => {}));
    avant.disabled = i === 0; apres.disabled = i === images.length - 1;
    avant.hidden = apres.hidden = tout.hidden = images.length < 2;
  };
  const aller = (d) => { const n = i + d; if (n < 0 || n >= images.length) return; i = n; montrer(); };
  const clore = () => { boite.classList.remove('ouverte'); document.body.style.overflow = ''; };
  avant.addEventListener('click', () => aller(-1)); apres.addEventListener('click', () => aller(1));
  fermer.addEventListener('click', clore);
  zone.addEventListener('click', (e) => { if (e.target === zone) clore(); });
  dl.addEventListener('click', () => enregistrer([images[i]]));
  tout.addEventListener('click', () => enregistrer(images));
  document.addEventListener('keydown', (e) => {
    if (!boite.classList.contains('ouverte')) return;
    if (e.key === 'Escape') clore(); else if (e.key === 'ArrowLeft') aller(-1); else if (e.key === 'ArrowRight') aller(1);
  });
  return (liste, depart) => { images = liste; i = depart || 0; montrer(); boite.classList.add('ouverte'); document.body.style.overflow = 'hidden'; fermer.focus(); };
})();
// branche une image (et son lien, s'il y en a un) sur la visionneuse
const agrandir = (im, liste, k) => {
  im.classList.add('agrandir');
  (im.closest('a') || im).addEventListener('click', (e) => { e.preventDefault(); visio(liste, k); });
};
// suivi de publication : { id: date } dans dents-du-cabinet/publications.json, suivi par git.
// Le serveur local l'écrit. En ligne le fichier est figé : une coche y reste sur l'appareil, en plus de celles du fichier.
const PUBLIES = __PUBLICATIONS__;
const CLE_PUB = 'dents-strip:publies';
let locaux = {};
try { locaux = JSON.parse(localStorage.getItem(CLE_PUB) || '{}') || {}; } catch (e) {}
const datePub = (id) => PUBLIES[id] || locaux[id] || null;
const cartes = [];
let filtre = 'tous';
const majFiltres = () => {
  const n = cartes.filter((c) => datePub(c.id)).length;
  [['tous', `Tous (${cartes.length})`], ['a-publier', `À publier (${cartes.length - n})`], ['publies', `Publiés (${n})`]].forEach(([cle, texte]) => {
    let b = $('filtres').querySelector(`[data-f="${cle}"]`);
    if (!b) {
      b = document.createElement('button'); b.type = 'button'; b.dataset.f = cle; $('filtres').appendChild(b);
      b.addEventListener('click', () => { filtre = cle; majFiltres(); });
    }
    b.textContent = texte; b.setAttribute('aria-pressed', String(filtre === cle));
  });
  cartes.forEach((c) => { const p = !!datePub(c.id); c.el.hidden = filtre === 'a-publier' ? p : filtre === 'publies' ? !p : false; });
};
const SERVEUR = !window.STATIQUE;                    // galerie statique (site.js) : pas de commentaires
const lire = async (id) => { if (!SERVEUR) return null; try { const r = await fetch(api(id)); return r.ok ? await r.json() : null; } catch (e) { return null; } };

S.forEach((s) => {
  const carte = document.createElement('article'); carte.className = 'carte';
  const url = (f) => `/${s.id}/${f}?v=${s.version}`;
  let v, fleches = null;
  const pages = (s.carrousel || []).map((p) => url(p.image));
  if (!s.planche && s.carrousel && s.carrousel.length) {
    // histoire longue : pas de planche unique, on feuillette les pages du carrousel
    v = document.createElement('div'); v.className = 'pages';
    s.carrousel.forEach((p, i) => {
      const a = document.createElement('a'); a.href = url(p.image); a.target = '_blank';
      const im = document.createElement('img'); im.src = url(p.image); im.alt = `Page ${i + 1} de ${s.titre}`; im.loading = 'lazy';
      a.appendChild(im); v.appendChild(a); agrandir(im, pages, i);
    });
    fleches = document.createElement('div'); fleches.className = 'fleches';
    const avant = document.createElement('button'), apres = document.createElement('button'), ou = document.createElement('span');
    avant.type = apres.type = 'button'; avant.textContent = '←'; apres.textContent = '→';
    avant.setAttribute('aria-label', 'Page précédente'); apres.setAttribute('aria-label', 'Page suivante');
    const page = () => Math.round(v.scrollLeft / Math.max(1, v.clientWidth));
    const maj = () => { const n = page(); ou.textContent = `Page ${n + 1} sur ${s.carrousel.length}`; avant.disabled = n === 0; apres.disabled = n === s.carrousel.length - 1; };
    const aller = (d) => v.scrollTo({ left: (page() + d) * v.clientWidth, behavior: 'smooth' });
    avant.addEventListener('click', () => aller(-1)); apres.addEventListener('click', () => aller(1));
    v.addEventListener('scroll', maj); maj();
    fleches.append(avant, ou, apres);
  } else if (s.planche) {
    v = document.createElement('a'); v.href = url(s.planche); v.target = '_blank';
    const im = document.createElement('img'); im.src = url(s.planche); im.alt = 'Planche ' + s.titre; im.loading = 'lazy'; v.appendChild(im); agrandir(im, [url(s.planche)].concat(pages), 0);
  } else {
    v = document.createElement('video');
    Object.assign(v, { muted: true, loop: true, playsInline: true, preload: 'none', src: url(s.video), poster: url('apercus/case1.png') });
    v.style.background = s.fond;
    v.addEventListener('click', () => (v.paused ? v.play() : v.pause()));
  }
  const corps = document.createElement('div'); corps.className = 'corps';
  const num = document.createElement('div'); num.className = 'num'; num.textContent = `${s.id} · série ${s.serie} · ${s.cases.length} cases`;
  const h2 = document.createElement('h2'); h2.textContent = s.titre;
  const lab = document.createElement('label'); lab.textContent = 'Commentaire'; lab.htmlFor = 'g-' + s.id;
  const ta = document.createElement('textarea'); ta.id = 'g-' + s.id; ta.placeholder = 'Ton avis sur ce strip';
  const lien = document.createElement('div'); lien.className = 'detail';
  [[`/${s.id}/viewer.html`, 'Commenter case par case'], [s.planche && s.video ? url(s.video) : null, 'Vidéo']].forEach(([h, t]) => {
    if (!h) return;
    const a = document.createElement('a'); a.href = h; a.textContent = t; if (t === 'Vidéo') a.target = '_blank'; lien.appendChild(a);
  });
  // publié ou à publier : une pastille et un bouton pour basculer
  const pub = document.createElement('div'); pub.className = 'pub';
  const pastille = document.createElement('span'); pastille.className = 'pastille';
  const bascule = document.createElement('button'); bascule.type = 'button';
  const majPub = () => {
    const d = datePub(s.id);
    carte.classList.toggle('publie', !!d);
    pastille.textContent = d ? 'Publié le ' + new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) : 'À publier';
    bascule.textContent = d ? 'Annuler' : 'Marquer comme publié';
    bascule.hidden = !SERVEUR && !!PUBLIES[s.id];        // en ligne, une coche du fichier ne se retire que depuis le serveur local
    majFiltres();
  };
  bascule.addEventListener('click', async () => {
    const date = datePub(s.id) ? null : new Date().toISOString().slice(0, 10);
    if (SERVEUR) {
      try {
        const r = await fetch('/api/publications', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: s.id, date }) });
        if (!r.ok) throw new Error();
        Object.keys(PUBLIES).forEach((k) => delete PUBLIES[k]); Object.assign(PUBLIES, await r.json());
        etat('Enregistré dans publications.json');
      } catch (e) { etat('Échec de l’enregistrement'); return; }
    } else {
      if (date) locaux[s.id] = date; else delete locaux[s.id];
      try { localStorage.setItem(CLE_PUB, JSON.stringify(locaux)); } catch (e) {}
    }
    majPub();
  });
  pub.append(pastille, bascule);
  cartes.push({ id: s.id, el: carte });
  corps.append(num, h2, pub, lab, ta, lien); carte.append(v); if (fleches) carte.append(fleches); carte.append(corps); $('grille').appendChild(carte);
  majPub();
  lire(s.id).then((d) => { if (d && d.general) ta.value = d.general; });

  // le commentaire d'ici va dans le champ « general » du strip, sans toucher aux commentaires par case
  let minuteur = null;
  ta.addEventListener('input', () => {
    etat('…'); clearTimeout(minuteur);
    minuteur = setTimeout(async () => {
      const d = (await lire(s.id)) || { id: s.id, source: s.source, cases: s.cases.map((c) => ({ case: c.index, texte: c.texte, commentaire: '' })) };
      Object.assign(d, { general: ta.value.trim(), maj: new Date().toISOString() });
      try {
        const r = await fetch(api(s.id), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d, null, 2) });
        etat(r.ok ? 'Enregistré à ' + new Date().toLocaleTimeString('fr-FR') : 'Échec de l’enregistrement');
      } catch (e) { etat('Serveur injoignable'); }
    }, 500);
  });
});
</script>
</body>
</html>
